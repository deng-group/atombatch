[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atombatch"
version = "0.0.1"
description = "Batch energy and force evaluations from many independent ASE tasks into shared model calls."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "ase>=3.23",
]

[project.optional-dependencies]
symmetrix = ["symmetrix-xl"]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/atombatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
